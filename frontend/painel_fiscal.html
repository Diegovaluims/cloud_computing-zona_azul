<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Azul - Painel do Fiscal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">🔍 Zona Azul — Painel do Fiscal</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">Voltar ao Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <!-- Card de Fiscalização -->
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Fiscalizar Veículo</h5>
                    </div>
                    <div class="card-body">
                        <form id="formFiscalizar">
                            <div class="input-group mb-3">
                                <input type="text" class="form-control" id="inputPlacaFiscal"
                                    placeholder="Digite a placa do veículo" required>
                                <button type="submit" class="btn btn-dark">Consultar</button>
                            </div>
                        </form>

                        <!-- Resultado da consulta -->
                        <div id="resultadoFiscalizacao" class="d-none">
                            <div id="cardResultado" class="card">
                                <div class="card-body text-center">
                                    <h3 id="statusTexto" class="mb-2"></h3>
                                    <p id="detalhesTexto" class="mb-0 text-muted"></p>
                                    <p id="placaConsultada" class="mt-2 mb-0"></p>
                                </div>
                            </div>
                        </div>

                        <div id="alertFiscal" class="alert d-none mt-3" role="alert"></div>
                    </div>
                </div>

                <!-- Histórico de consultas -->
                <div class="card shadow-sm mt-4">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">Histórico de Consultas</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm table-striped">
                            <thead>
                                <tr>
                                    <th>Placa</th>
                                    <th>Status</th>
                                    <th>Horário</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaHistorico"></tbody>
                        </table>
                        <p id="semHistorico" class="text-muted text-center">Nenhuma consulta realizada.</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/api_fiscal.js"></script>
</body>

</html>
