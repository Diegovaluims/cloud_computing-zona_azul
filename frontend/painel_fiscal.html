<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Azul - Painel do Fiscal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .sidebar {
            background: linear-gradient(180deg, #111 0%, #333 100%);
        }
        .btn-primary-custom {
            background: #222;
        }
        .btn-primary-custom:hover {
            background: #000;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Fiscalização</h2>
            <nav>
                <ul>
                    <li class="nav-item active" data-target="secao-fiscalizacao">🔍 Consultar Placa</li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <span id="nomeFiscalSidebar" class="d-block mb-2 font-weight-bold"></span>
                <button id="btnLogoutFiscal" class="btn btn-outline-light btn-sm w-100">Sair</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Fiscalização -->
            <section id="secao-fiscalizacao" class="secao-spa active">
                <h3 class="mb-4">Central de Fiscalização</h3>
                <div class="card-glass">
                    <form id="formFiscalizacao" class="mb-4">
                        <div class="row g-2 justify-content-center">
                            <div class="col-md-6">
                                <input type="text" class="form-control form-control-lg text-center" id="inputPlacaFiscal" placeholder="Digite a Placa (ex: ABC1234)" required style="text-transform: uppercase; font-size: 1.5rem; letter-spacing: 2px;">
                            </div>
                            <div class="col-md-3">
                                <button type="submit" class="btn-primary-custom btn-lg w-100 h-100">Consultar</button>
                            </div>
                        </div>
                    </form>

                    <!-- Resultado da Consulta -->
                    <div id="resultadoConsulta" class="d-none text-center mt-5">
                        <h1 id="statusPlaca" class="display-4 fw-bold"></h1>
                        <p id="detalhesPlaca" class="lead mt-3"></p>
                        
                        <div id="areaMulta" class="mt-4 d-none">
                            <button id="btnEmitirMulta" class="btn btn-danger btn-lg px-5">Emitir Multa (R$ 50,00)</button>
                            <input type="hidden" id="motivoMultaOculto">
                        </div>
                        <div id="alertMulta" class="alert-glass mt-3 d-none text-start"></div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="js/api_fiscal.js?v=2"></script>
</body>
</html>
