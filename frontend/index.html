<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Azul - Autenticação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            margin: 0;
            overflow: hidden;
        }

        /* Elementos de fundo dinâmicos */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 10s infinite ease-in-out;
            z-index: 0;
        }

        .bg-circle-1 { width: 400px; height: 400px; top: -100px; left: -100px; }
        .bg-circle-2 { width: 300px; height: 300px; bottom: -50px; right: -50px; animation-delay: -5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            z-index: 1;
            position: relative;
            transition: all 0.4s ease;
        }

        .glass-card h3 {
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 10px;
            padding: 0.8rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00d2ff;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-label {
            font-weight: 300;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00d2ff 0%, #3a7bd5 100%);
            border: none;
            border-radius: 10px;
            padding: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
        }

        .btn-outline-light {
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-link {
            color: #00d2ff;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .toggle-link:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Animação suave para transição de forms */
        .form-section {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>

    <div class="glass-card">
        <h3>🚙 Zona Azul Premium</h3>

        <!-- MODO LOGIN -->
        <div id="loginSection" class="form-section active">
            <form id="formLogin">
                <div class="mb-3">
                    <label for="emailLogin" class="form-label">E-mail de Acesso</label>
                    <input type="email" class="form-control" id="emailLogin" placeholder="nome@exemplo.com" required>
                </div>
                <div class="mb-4">
                    <label for="senhaLogin" class="form-label">Senha (Opcional por enquanto)</label>
                    <input type="password" class="form-control" id="senhaLogin" placeholder="••••••••">
                </div>
                <button type="submit" id="btnLogin" class="btn btn-primary w-100">
                    <span id="spinnerLogin" class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
                    Acessar o Sistema
                </button>
            </form>
            <div class="text-center mt-3">
                <small>Não possui uma conta? <span class="toggle-link" onclick="toggleMode('cadastro')">Cadastre-se</span></small>
            </div>
        </div>

        <!-- MODO CADASTRO -->
        <div id="cadastroSection" class="form-section">
            <form id="formCadastro">
                <div class="mb-3">
                    <label for="nomeCadastro" class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="nomeCadastro" placeholder="Ex: João da Silva" required>
                </div>
                <div class="mb-4">
                    <label for="emailCadastro" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="emailCadastro" placeholder="nome@exemplo.com" required>
                </div>
                <button type="submit" id="btnCadastro" class="btn btn-primary w-100">
                    <span id="spinnerCadastro" class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
                    Criar Minha Conta
                </button>
            </form>
            <div class="text-center mt-3">
                <small>Já tem uma conta? <span class="toggle-link" onclick="toggleMode('login')">Faça o Login</span></small>
            </div>
        </div>

        <!-- MENSAGENS -->
        <div id="mensagemErro" class="alert alert-danger mt-4 d-none" role="alert" style="background: rgba(220, 53, 69, 0.2); border-color: #dc3545; color: #ffb3b3;"></div>
        <div id="mensagemSucesso" class="alert alert-success mt-4 d-none" role="alert" style="background: rgba(25, 135, 84, 0.2); border-color: #198754; color: #a3cfbb;"></div>

        <hr style="border-color: rgba(255,255,255,0.2); margin: 1.5rem 0;">
        
        <a href="painel_fiscal.html" class="btn btn-outline-light w-100 text-center text-decoration-none">🔍 Acessar Área do Fiscal</a>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
