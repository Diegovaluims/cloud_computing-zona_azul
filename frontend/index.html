<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Azul - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">🚙 Zona Azul</h3>

        <form id="formLogin">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail de Acesso</label>
                <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" placeholder="senha" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Entrar no Sistema</button>
        </form>

        <div id="mensagemErro" class="alert alert-danger mt-3 d-none" role="alert"></div>

        <hr>
        <a href="painel_fiscal.html" class="btn btn-outline-secondary w-100">🔍 Acessar Painel do Fiscal</a>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
