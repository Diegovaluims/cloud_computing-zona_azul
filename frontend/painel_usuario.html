<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Azul - Painel do Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }

        /* Elementos de fundo dinâmicos */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 10s infinite ease-in-out;
            z-index: -1;
        }

        .bg-circle-1 { width: 400px; height: 400px; top: -100px; left: -100px; }
        .bg-circle-2 { width: 300px; height: 300px; bottom: -50px; right: -50px; animation-delay: -5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .navbar {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            color: #fff;
        }

        .glass-card .card-header {
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        
        .glass-card h5 {
            font-weight: 600;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00d2ff;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        /* Select dropdown text color workaround for dark backgrounds */
        .form-select option {
            background-color: #203a43;
            color: #fff;
        }

        .table {
            color: #fff;
        }

        .table-striped>tbody>tr:nth-of-type(odd)>* {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .table th {
            border-bottom-color: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        .table td {
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        .btn-success {
            background: linear-gradient(45deg, #11998e 0%, #38ef7d 100%);
            border: none;
            transition: all 0.3s ease;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #cb2d3e 0%, #ef473a 100%);
            border: none;
            transition: all 0.3s ease;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(239, 71, 58, 0.4);
        }
        
        .text-muted {
            color: rgba(255, 255, 255, 0.6) !important;
        }

        .alert-danger {
            background: rgba(220, 53, 69, 0.2);
            border-color: #dc3545;
            color: #ffb3b3;
        }

        .alert-success {
            background: rgba(25, 135, 84, 0.2);
            border-color: #198754;
            color: #a3cfbb;
        }
    </style>
</head>

<body>
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Zona Azul — Painel do Usuário</span>
            <div>
                <span id="nomeUsuario" class="me-3"></span>
                <button id="btnLogout" class="btn btn-outline-light btn-sm">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">

            <!-- ==================== GARAGEM ==================== -->
            <div class="col-md-6">
                <div class="glass-card">
                    <div class="card-header">
                        <h5 class="mb-0">Minha Garagem</h5>
                    </div>
                    <div>
                        <!-- Formulário para adicionar veículo -->
                        <form id="formVeiculo" class="mb-3">
                            <div class="row g-2">
                                <div class="col-4">
                                    <input type="text" class="form-control form-control-sm" id="inputPlaca"
                                        placeholder="Placa" required>
                                </div>
                                <div class="col-4">
                                    <input type="text" class="form-control form-control-sm" id="inputModelo"
                                        placeholder="Modelo" required>
                                </div>
                                <div class="col-2">
                                    <input type="number" class="form-control form-control-sm" id="inputAno"
                                        placeholder="Ano" required>
                                </div>
                                <div class="col-2">
                                    <button type="submit" class="btn btn-success btn-sm w-100">+</button>
                                </div>
                            </div>
                        </form>

                        <div id="alertGaragem" class="alert d-none" role="alert"></div>

                        <!-- Lista de veículos -->
                        <table class="table table-sm table-striped">
                            <thead>
                                <tr>
                                    <th>Placa</th>
                                    <th>Modelo</th>
                                    <th>Ano</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tabelaVeiculos"></tbody>
                        </table>
                        <p id="semVeiculos" class="text-muted text-center d-none">Nenhum veículo cadastrado.</p>
                    </div>
                </div>
            </div>

            <!-- ==================== RESERVAS ==================== -->
            <div class="col-md-6">
                <div class="glass-card">
                    <div class="card-header">
                        <h5 class="mb-0">Minhas Reservas</h5>
                    </div>
                    <div>
                        <!-- Formulário para emitir reserva -->
                        <form id="formReserva" class="mb-3">
                            <div class="row g-2">
                                <div class="col-8">
                                    <select class="form-select form-select-sm" id="selectPlacaReserva" required>
                                        <option value="">Selecione um veículo...</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <button type="submit" class="btn btn-success btn-sm w-100">Reservar</button>
                                </div>
                            </div>
                        </form>

                        <div id="alertReserva" class="alert d-none" role="alert"></div>

                        <!-- Lista de reservas -->
                        <table class="table table-sm table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Veículo</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tabelaReservas"></tbody>
                        </table>
                        <p id="semReservas" class="text-muted text-center d-none">Nenhuma reserva ativa.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/api_usuario.js"></script>
</body>

</html>
