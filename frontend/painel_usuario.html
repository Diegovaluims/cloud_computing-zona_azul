<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Azul - Painel do Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand">🚙 Zona Azul — Painel do Usuário</span>
            <div>
                <span id="nomeUsuario" class="text-white me-3"></span>
                <button id="btnLogout" class="btn btn-outline-light btn-sm">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">

            <!-- ==================== GARAGEM ==================== -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">🚗 Minha Garagem</h5>
                    </div>
                    <div class="card-body">
                        <!-- Formulário para adicionar veículo -->
                        <form id="formVeiculo" class="mb-3">
                            <div class="row g-2">
                                <div class="col-4">
                                    <input type="text" class="form-control form-control-sm" id="inputPlaca"
                                        placeholder="Placa" required>
                                </div>
                                <div class="col-4">
                                    <input type="text" class="form-control form-control-sm" id="inputModelo"
                                        placeholder="Modelo" required>
                                </div>
                                <div class="col-2">
                                    <input type="number" class="form-control form-control-sm" id="inputAno"
                                        placeholder="Ano" required>
                                </div>
                                <div class="col-2">
                                    <button type="submit" class="btn btn-success btn-sm w-100">+</button>
                                </div>
                            </div>
                        </form>

                        <div id="alertGaragem" class="alert d-none" role="alert"></div>

                        <!-- Lista de veículos -->
                        <table class="table table-sm table-striped">
                            <thead>
                                <tr>
                                    <th>Placa</th>
                                    <th>Modelo</th>
                                    <th>Ano</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tabelaVeiculos"></tbody>
                        </table>
                        <p id="semVeiculos" class="text-muted text-center d-none">Nenhum veículo cadastrado.</p>
                    </div>
                </div>
            </div>

            <!-- ==================== RESERVAS ==================== -->
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">🅿️ Minhas Reservas</h5>
                    </div>
                    <div class="card-body">
                        <!-- Formulário para emitir reserva -->
                        <form id="formReserva" class="mb-3">
                            <div class="row g-2">
                                <div class="col-8">
                                    <select class="form-select form-select-sm" id="selectPlacaReserva" required>
                                        <option value="">Selecione um veículo...</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <button type="submit" class="btn btn-success btn-sm w-100">Reservar</button>
                                </div>
                            </div>
                        </form>

                        <div id="alertReserva" class="alert d-none" role="alert"></div>

                        <!-- Lista de reservas -->
                        <table class="table table-sm table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Veículo</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tabelaReservas"></tbody>
                        </table>
                        <p id="semReservas" class="text-muted text-center d-none">Nenhuma reserva ativa.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/api_usuario.js"></script>
</body>

</html>
