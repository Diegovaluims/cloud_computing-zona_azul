services:
  # --- db: banco de dados PostgreSQL ---
  db:
    image: postgres:15-alpine # alpine: imagem slim
    container_name: zona_azul_db
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5433:5432" # exposta para acesso local (DBeaver, psql)
    volumes:
      - pgdata:/var/lib/postgresql/data # volume persistente: dados sobrevivem ao restart
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql # executado automaticamente no primeiro start

  # --- api_usuario: microsserviço do usuário ---
  api_usuario:
    build: 
      context: .
      dockerfile: ./backend_usuario/Dockerfile
    container_name: zona_azul_api_usuario
    restart: always
    depends_on:
      - db # garante que o db esteja pronto antes de subir
    env_file: .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

  # --- api_fiscal: microsserviço do fiscal ---
  api_fiscal:
    build: 
      context: .
      dockerfile: ./backend_fiscal/Dockerfile
    container_name: zona_azul_api_fiscal
    restart: always
    depends_on:
      - db # garante que o db esteja pronto antes de subir
    env_file: .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ADMIN_KEY=${ADMIN_KEY}

  # --- api_auth: microsserviço de autenticação ---
  api_auth:
    build: 
      context: .
      dockerfile: ./backend_auth/Dockerfile
    container_name: zona_azul_api_auth
    restart: always
    depends_on:
      - db
    env_file: .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ADMIN_KEY=${ADMIN_KEY}

  # --- frontend: Nginx para servir arquivos estáticos ---
  frontend:
    image: nginx:alpine
    container_name: zona_azul_frontend
    restart: always
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata: